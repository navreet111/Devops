<!DOCTYPE html>
<html>

<head>

    <title>Login Success</title>

</head>

<body>

<h2>Logging in...</h2>

<script>

    const params =
    new URLSearchParams(window.location.search);

    const token =
    params.get("token");

    if(token){

        localStorage.setItem("jwt",token);

        window.location.href="/index.html";

    }

</script>

</body>

</html>
