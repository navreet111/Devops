spring.application.name=quantity-service

# Runs on a different port than auth-service (8080) since they are now
# two independent deployable services.
server.port=8081

spring.datasource.url=jdbc:h2:file:./data/quantitydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# JWT Secret - MUST be identical to auth-service's app.jwt.secret
# so tokens issued there are verifiable here without any network call.
app.jwt.secret=QuantityMeasurementApplicationSecretKey12345678901234567890

# 24 Hours
app.jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG
