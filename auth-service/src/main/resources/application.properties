spring.application.name=auth-service

# Kept on 8080 so the existing Google OAuth2 redirect URI
# (http://localhost:8080/login/oauth2/code/google) registered in
# Google Cloud Console keeps working WITHOUT any external reconfiguration.
server.port=8080

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JWT Secret - MUST be identical to quantity-service's app.jwt.secret
# so tokens issued here are verifiable there without any network call.
app.jwt.secret=QuantityMeasurementApplicationSecretKey12345678901234567890

# 24 Hours
app.jwt.expiration=86400000

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
